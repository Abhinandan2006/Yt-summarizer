[project]
name = "yt-rag"
version = "0.1.0"
description = "Production-quality YouTube video summarizer and timestamped Q&A powered by RAG"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Senior AI/ML Engineer", email = "engineer@example.com" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "youtube-transcript-api>=0.6.2",
    "yt-dlp>=2024.11.4",
    "chromadb>=0.5.18",
    "sentence-transformers>=3.3.0",
    "google-genai>=0.1.1",
    "openai>=1.54.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.17",
    "faster-whisper>=1.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

